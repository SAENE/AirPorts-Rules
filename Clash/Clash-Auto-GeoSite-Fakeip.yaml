# 你的订阅链接
proxy-providers:
  Sub:
    type: http
    url: https://example.com/sub?xxxx
    interval: 3600
    proxy: DIRECT
    path: ./providers/Sub.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
    override:
      skip-cert-verify: false
      udp: true
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: :1053
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,fake-ip-filter,real-ip
    - GEOSITE,connectivity-check,real-ip
    - GEOSITE,bilibili,fake-ip
    - GEOSITE,tiktok,fake-ip
    - GEOSITE,CN,real-ip
    - GEOSITE,geolocation-cn,real-ip
    - GEOSITE,private,real-ip
    - MATCH,fake-ip
  fake-ip-ttl: 1
  prefer-h3: true
  respect-rules: true
  direct-nameserver-follow-policy: true
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://doh.360.cn/dns-query
  nameserver-policy:
    geosite:private:
      - system
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://doh.360.cn/dns-query
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://101.198.198.198/dns-query
    - https://120.53.53.53/dns-query
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  force-domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
    - +.google.cn
    - +.google.cn
    - +.googleapis.cn
    - +.hotels.cn
    - +.keso.cn
  skip-domain:
    - +.apple.com
    - Mijia Cloud
    - dlg.io.mi.com
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    QUIC:
      ports:
        - 443
        - 8443
ipv6: true
external-ui: ./ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
tcp-concurrent: true
unified-delay: true
find-process-mode: strict
global-client-fingerprint: random
keep-alive-interval: 15
keep-alive-idle: 15
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true
geodata-loader: memconservative
geox-url:
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.metadb
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
rule-providers:
  fake-ip-filter:
    type: http
    behavior: domain
    format: text
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/juewuy/ShellCrash@dev/public/fake_ip_filter.list
    path: ./ruleset/fake_ip_filter.list
  tor:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/tor.mrs
    path: ./ruleset/tor.mrs
profile:
  store-selected: true
  store-fake-ip: true
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30
proxies:
  ~
proxy-groups:
  - name: 🔰国外流量
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - ♻️自动选择
      - 🔯故障转移
      - 🚀直接连接
  - name: ♻️自动选择
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100
    use:
      - Sub
    filter: (^(?!.*((?<![\d.])([2-9]|\d{2,})(\.\d+)?(x|倍)|(?<![\d.])1\.[1-9]+(x|倍))).*)
  - name: 🔯故障转移
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    use:
      - Sub
    filter: .*
  - name: "🌐DNS&配置规则"
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🔰国外流量
      - 🚀直接连接
      - ♻️自动选择
      - 🔯故障转移
  - name: ⚓️其他流量
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🔰国外流量
      - 🚀直接连接
      - ♻️自动选择
      - 🔯故障转移
  - name: ✈️Telegram
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🔯故障转移
  - name: 🔎Google
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🔯故障转移
  - name: 🇦🇮AI
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🔯故障转移
  - name: 📺哔哩哔哩
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🚀直接连接
      - 🔰国外流量
      - ♻️自动选择
      - 🔯故障转移
  - name: 🎵TikTok
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🚀直接连接
      - 🔰国外流量
      - ♻️自动选择
      - 🔯故障转移
  - name: 🎬国外媒体
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🔯故障转移
  - name: 🍎苹果服务
    type: select
    proxies:
      - 🚀直接连接
      - 🔰国外流量
      - ♻️自动选择
  - name: Ⓜ️微软服务
    type: select
    proxies:
      - 🚀直接连接
      - 🔰国外流量
      - ♻️自动选择
  - name: 📟游戏平台
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🔰国外流量
      - 🚀直接连接
      - ♻️自动选择
      - 🔯故障转移
  - name: 🔽游戏下载
    type: select
    use:
      - Sub
    filter: .*
    proxies:
      - 🚀直接连接
